name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-raylib
            mingw-w64-x86_64-pkgconf

      - name: Build snake_gui.exe
        run: |
          mkdir -p dist
          g++ -std=c++17 -O2 -Wall -Wextra src/snake_gui.cpp -o dist/snake_gui.exe $(pkg-config --cflags --libs raylib)
          # Bundle MinGW runtime/raylib DLLs next to the exe when they are not static.
          ldd dist/snake_gui.exe 2>/dev/null | awk '/mingw64\/bin/ {print $3}' | while read -r dll; do
            cp "$dll" dist/
          done || true
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: snake_gui-windows-x64
          path: dist/
          if-no-files-found: error
